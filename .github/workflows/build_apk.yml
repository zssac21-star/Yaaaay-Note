name: Build & Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore & Secrets
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "StudyFlow App (Build #${{ github.run_number }})"
          body: |
            ### 📱 StudyFlow Android APK
            
            Android ডিভাইসে ইনস্টল করতে নিচের Assets থেকে **`app-debug.apk`** ফাইলটি নামিয়ে নিন।
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
